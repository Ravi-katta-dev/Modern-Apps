# Automated dependency monitoring (SUPPLY_CHAIN_RISKS.md 6.4).
#
# Scheduling note: this repo has 100+ Gradle modules but a single Cargo
# workspace (repo root, one committed Cargo.lock). Ungrouped weekly updates
# every ecosystem is monthly and every ecosystem collapses its minor/patch bumps
# into a single grouped PR. Major bumps stay ungrouped (they need individual
# review) and are capped by open-pull-requests-limit.
#
# Dependabot *security* alerts are not affected by this schedule - they are
# raised as soon as an advisory lands, independently of the interval below.

version: 2

updates:
  # ---- Gradle / JVM ----------------------------------------------------
  # Nearly every module resolves its versions through the single version
  # catalog at gradle/libs.versions.toml, so the root directory covers the
  # whole app tree. build-logic is a separate included build (it has its own
  # settings.gradle.kts) and has to be listed explicitly.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/build-logic"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "gradle"
    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---- Cargo -----------------------------------------------------------
  # Single entry: the tree has exactly one tracked Cargo workspace (repo root)
  # and one tracked Cargo.lock (`git ls-files '*Cargo.lock'`). Every crate
  # under code/, games/, library/ and scripts/maps/ is a member of that
  # workspace (no [workspace] table of its own), so monitoring "/" covers them
  # all. `personal/uniflix_strem` is a detached workspace of its own but lives under
  # gitignored personal/, so neither Dependabot nor CI can see it — nothing to
  # add here. Do NOT add per-crate directories unless another tracked
  # workspace root with its own tracked lockfile appears (keep in sync with
  # .github/workflows/cargo-deny.yml).
  # The repo root workspace covers all the app-level src/main/rust members and
  # the vendored third_party/betocore crates (path dependencies, which
  # Dependabot ignores).
  # third_party/betocore/*/fuzz are vendored fuzz harnesses and are all
  # deliberately left out: nothing they pull in is linked into a shipped .so,
  # so a libfuzzer-sys advisory would reach reviewers as product risk when it
  # is not.
  #
  # Reviewer note: a `jni` 0.22 PR should not be merged as-is. The root
  # Cargo.toml documents that the 0.21 -> 0.22 API change touches all 31 native
  # entry points and is deliberately deferred.
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---- GitHub Actions --------------------------------------------------
  # Covers every workflow under .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions-all:
        patterns:
          - "*"
