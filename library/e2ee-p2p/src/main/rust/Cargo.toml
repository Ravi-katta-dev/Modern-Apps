[package]
name = "e2ee_pqc"
version = "0.1.0"
edition = "2021"
description = "ML-KEM-768 + ML-DSA-65 for the e2ee-p2p library (FIPS 203/204, RustCrypto-adjacent), DER-compatible with the previous Bouncy Castle encoding, exposed to Kotlin via JNI."
license = "GPL-2.0-only"

[lib]
name = "e2ee_pqc"
crate-type = ["cdylib", "rlib"]

[dependencies]
fips203.workspace = true
fips204.workspace = true
sha2.workspace = true
sha3.workspace = true
shake.workspace = true
jni.workspace = true
rand.workspace = true
rand_core.workspace = true
# rand 0.8 for rPGP keygen/encrypt RNG (workspace default is 0.10; see root).
rand08.workspace = true
# OpenPGP packet engine for SecureMail (generate/armor/encrypt/decrypt).
# Same crate as the relay server would use; the JNI surface below exposes only
# what the app needs (no WKD/SMTP — those stay in Kotlin via library:network).
pgp.workspace = true
# Base64 framing for PGP/MIME armor output (workspace pin, betocore line).
base64.workspace = true
# smallvec! for rPGP key-preference lists (workspace pin, betocore line).
smallvec.workspace = true
