[package]
name = "yuu_avatar"
version = "0.1.0"
edition = "2021"
description = "Yuu 3D avatar engine: glTF upper-body base mesh, skeletal skinning, preset poses, Vulkan renderer"
license = "GPL-2.0-only"

[lib]
name = "yuu_avatar"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
ash = { workspace = true, default-features = false, features = ["loaded"] }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# glTF 2.0 base-mesh loading (rigged upper-body avatar + skin weights).
gltf = "1.4"
# GLES fallback for Vulkan-less devices (ONN 4K box, Mali-G31, armeabi-v7a):
# glow 0.13 loads GL symbols via eglGetProcAddress; khronos-egl 6 provides the
# EGL display/surface/context wrappers. `dynamic` (dlopen at runtime) — NOT
# `static`: that feature probes pkg-config for egl at build time, which fails
# for Android cross-compiles and on hosts without system EGL.
glow = "0.13"
khronos-egl = { version = "6", features = ["dynamic"] }
