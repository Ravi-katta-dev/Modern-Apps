[package]
name = "kart_engine"
version = "0.1.0"
edition = "2021"
description = "Kart TV racer engine: Sunset Oval track mesh, arcade kart physics, chase cam, items + AI, Vulkan renderer"
license = "GPL-2.0-only"

[lib]
name = "kart_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni.workspace = true
ash = { workspace = true, default-features = false, features = ["loaded"] }
glam = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
